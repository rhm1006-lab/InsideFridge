      /* Hide scrollbar for cleaner kiosk look by default */
      ::-webkit-scrollbar { width: 0px; background: transparent; }
      
      /* Custom visible scrollbar for specific areas */

      }

      }

        background: #cbd5e1;
        border-radius: 4px;
      }

      }
